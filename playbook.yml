---
- name: Automate Server Config
  hosts: all
  become: true
  tasks:
    - name: Install Apache web server
      dnf:
        name: httpd
        state: present

    - name: Start and enable Apache service
      service:
        name: httpd
        state: started
        enabled: true

    - name: Deploy harsh custom web page
      copy:
        dest: /var/www/html/index.html
        content: "<h1>Harsh Ansible Remote Configuration Successful</h1>\n"